<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rahul - Calculator</title><style>body{font:20px Arial;background:#fef3c7;padding:30px}.box{max-width:300px;margin:auto;background:white;padding:25px;border:3px solid #92400e;border-radius:12px}.screen{background:#1f2937;color:white;padding:18px;text-align:right;font-size:28px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}button{padding:15px;font-size:18px}</style></head><body><main class="box"><h2>Rahul's Calculator</h2><div class="screen" id="s">0</div><div class="keys"><button onclick="c()">C</button><button onclick="p(7)">7</button><button onclick="p(8)">8</button><button onclick="p('+')">+</button><button onclick="p(4)">4</button><button onclick="p(5)">5</button><button onclick="p(6)">6</button><button onclick="p('-')">-</button><button onclick="p(1)">1</button><button onclick="p(2)">2</button><button onclick="p(3)">3</button><button onclick="p('*')">×</button><button onclick="p(0)">0</button><button onclick="calc()">=</button></div></main><script>let v='';function p(x){v+=x;s.textContent=v}function c(){v='';s.textContent=0}function calc(){try{v=String(Function('return '+v)());s.textContent=v}catch(e){c()}}</script></body></html>
