<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepak - Mood Generator</title>
  <style>
    body{font-family:Arial,sans-serif;background:#fef3c7;color:#78350f;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
    .box{background:#fff;border:3px solid #d97706;border-radius:18px;padding:30px;text-align:center;width:min(430px,90%);box-shadow:8px 8px #fbbf24}
    .emoji{font-size:5rem;margin:20px 0}
    button{padding:12px 20px;border:0;border-radius:9px;background:#d97706;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer}
    button:hover{background:#b45309}
  </style>
</head>
<body>
  <main class="box">
    <p>DEEPAK'S MINI PROJECT</p>
    <h1>Mood Generator</h1>
    <div class="emoji" id="emoji">😊</div>
    <h2 id="mood">Happy</h2>
    <p id="message">Today is a great day to learn something new.</p>
    <button id="generate">Generate my mood</button>
  </main>
  <script>
    const moods = [
      ['😊', 'Happy', 'Share your positive energy with someone today.'],
      ['😎', 'Cool', 'Stay calm and enjoy the little things.'],
      ['🤩', 'Excited', 'Turn your excitement into a fun new idea.'],
      ['😴', 'Sleepy', 'Take a short break and recharge your energy.'],
      ['💪', 'Strong', 'You can handle one small challenge right now.']
    ];
    document.querySelector('#generate').onclick = () => {
      const mood = moods[Math.floor(Math.random() * moods.length)];
      document.querySelector('#emoji').textContent = mood[0];
      document.querySelector('#mood').textContent = mood[1];
      document.querySelector('#message').textContent = mood[2];
    };
  </script>
</body>
</html>
