<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepak - Color Picker</title>
  <style>
    body{font-family:Arial,sans-serif;background:#ecfdf5;color:#064e3b;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
    .box{background:#fff;border:3px solid #047857;border-radius:16px;padding:28px;text-align:center;width:min(420px,90%);box-shadow:8px 8px #6ee7b7}
    input{width:100%;height:90px;border:0;cursor:pointer}
    button{margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:#059669;color:#fff;font-weight:bold;cursor:pointer}
    #code{font-weight:bold;font-size:1.2rem}
  </style>
</head>
<body>
  <main class="box">
    <p>DEEPAK'S MINI PROJECT</p>
    <h1>Color Picker</h1>
    <input id="picker" type="color" value="#10b981" aria-label="Choose a color">
    <p>Selected color: <span id="code">#10b981</span></p>
    <button id="copy">Copy color code</button>
  </main>
  <script>
    const picker = document.querySelector('#picker');
    const code = document.querySelector('#code');
    picker.oninput = () => code.textContent = picker.value;
    document.querySelector('#copy').onclick = async () => {
      await navigator.clipboard.writeText(picker.value);
      document.querySelector('#copy').textContent = 'Copied!';
      setTimeout(() => document.querySelector('#copy').textContent = 'Copy color code', 1200);
    };
  </script>
</body>
</html>
