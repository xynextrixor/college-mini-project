<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --background: #fff7ed;
      --card: #ffffff;
      --text: #431407;
      --muted: #9a3412;
      --accent: #ea580c;
      --accent-dark: #c2410c;
      --track: #fed7aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(135deg, #ffedd5, var(--background));
      font-family: Arial, sans-serif;
    }

    .timer-card {
      width: min(100%, 440px);
      padding: 34px;
      text-align: center;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(124, 45, 18, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .mode-group {
      width: 100%;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--text);
      background: #ffedd5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--track);
    }

    button.active,
    .controls .primary {
      color: #ffffff;
      background: var(--accent);
    }

    button.active:hover,
    .controls .primary:hover {
      background: var(--accent-dark);
    }

    .progress-ring {
      width: 240px;
      height: 240px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 12px solid var(--track);
      border-top-color: var(--accent);
      border-radius: 50%;
      transform: rotate(45deg);
    }

    .time {
      transform: rotate(-45deg);
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status {
      min-height: 24px;
      margin-bottom: 20px;
      color: var(--muted);
      font-weight: 700;
    }

    .custom-time {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin: -8px 0 20px;
      color: var(--muted);
      font-weight: 700;
    }

    .custom-time input {
      width: 82px;
      padding: 10px;
      border: 2px solid var(--track);
      border-radius: 999px;
      color: var(--text);
      font: inherit;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    @media (max-width: 420px) {
      .timer-card {
        padding: 26px 18px;
      }

      .progress-ring {
        width: 210px;
        height: 210px;
      }
    }
  </style>
</head>
<body>
  <main class="timer-card">
    <h1>Pomodoro Timer</h1>
    <p class="subtitle">Focus in short, productive sessions.</p>

    <div class="modes" aria-label="Timer modes">
      <div class="mode-group">Focus duration</div>
      <button class="mode active" data-minutes="15" data-label="15-minute focus">15 min</button>
      <button class="mode" data-minutes="25" data-label="25-minute focus">25 min</button>
      <button class="mode" data-minutes="50" data-label="50-minute focus">50 min</button>
      <button class="mode" data-minutes="90" data-label="90-minute focus">90 min</button>

      <div class="mode-group">Break duration</div>
      <button class="mode" data-minutes="5" data-label="Short break">Short Break</button>
      <button class="mode" data-minutes="15" data-label="Long break">Long Break</button>
    </div>

    <div class="custom-time">
      <label for="custom-minutes">Need another timing?</label>
      <input id="custom-minutes" type="number" min="1" max="180" placeholder="Minutes">
      <button id="set-custom">Set</button>
    </div>

    <div class="progress-ring">
      <div class="time" id="time">25:00</div>
    </div>

    <div class="status" id="status">Ready to focus?</div>

    <div class="controls">
      <button class="primary" id="start">Start</button>
      <button id="reset">Reset</button>
    </div>
  </main>

  <script>
    const timeElement = document.getElementById("time");
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    const customMinutesInput = document.getElementById("custom-minutes");
    const setCustomButton = document.getElementById("set-custom");
    const modeButtons = document.querySelectorAll(".mode");

    let duration = 15 * 60;
    let remaining = duration;
    let timerId = null;

    function render() {
      const minutes = Math.floor(remaining / 60).toString().padStart(2, "0");
      const seconds = (remaining % 60).toString().padStart(2, "0");
      timeElement.textContent = `${minutes}:${seconds}`;
    }

    function setMode(button) {
      modeButtons.forEach((mode) => mode.classList.remove("active"));
      button.classList.add("active");
      duration = Number(button.dataset.minutes) * 60;
      remaining = duration;
      stopTimer();
      statusElement.textContent = `${button.dataset.label} selected.`;
      render();
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      startButton.textContent = "Start";
    }

    function startTimer() {
      if (timerId) {
        stopTimer();
        statusElement.textContent = "Timer paused.";
        return;
      }

      statusElement.textContent = "Stay focused!";
      startButton.textContent = "Pause";
      timerId = setInterval(() => {
        remaining -= 1;
        render();

        if (remaining <= 0) {
          stopTimer();
          remaining = duration;
          statusElement.textContent = "Session complete!";
          render();
        }
      }, 1000);
    }

    function resetTimer() {
      stopTimer();
      remaining = duration;
      statusElement.textContent = "Ready to focus?";
      render();
    }

    function setCustomTime() {
      const minutes = Number(customMinutesInput.value);

      if (!Number.isInteger(minutes) || minutes < 1 || minutes > 180) {
        statusElement.textContent = "Enter a whole number from 1 to 180.";
        customMinutesInput.focus();
        return;
      }

      modeButtons.forEach((mode) => mode.classList.remove("active"));
      duration = minutes * 60;
      remaining = duration;
      stopTimer();
      statusElement.textContent = `${minutes}-minute custom focus selected.`;
      render();
    }

    modeButtons.forEach((button) => button.addEventListener("click", () => setMode(button)));
    startButton.addEventListener("click", startTimer);
    resetButton.addEventListener("click", resetTimer);
    setCustomButton.addEventListener("click", setCustomTime);
    render();
  </script>
</body>
</html>
