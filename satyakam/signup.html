<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Institute - Signup</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">TITAN INSTITUTE</div>
        <h1>SCHOLAR ENROLLMENT</h1>
        <form action="index.html" method="get">
            <input type="text" name="fullname" placeholder="FULL LEGAL NAME" required>
            <input type="text" name="scholarid" placeholder="TITAN ROLL NUMBER" required>
            <input type="password" name="password" placeholder="ASSIGN ACCESS KEY" required>
            <button type="submit">COMPLETE ENROLLMENT</button>
        </form>
        <a href="index.html">RETURN TO GATEWAY</a>
    </div>
    <div class="owner-badge">OWNER: SATYAKAM</div>
</body>
</html>
