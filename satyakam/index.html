<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satyakam - Expenses</title><style>body{font:18px Arial;background:#fff7ed;padding:30px}.box{max-width:600px;margin:auto;background:white;padding:25px;border:3px solid #c2410c;border-radius:12px}input,button{padding:10px;margin:4px}li{margin:8px}</style></head><body><main class="box"><h1>Satyakam's Expenses</h1><h2>Total: ₹<span id="total">0</span></h2><form id="f"><input id="name" placeholder="Item" required><input id="amount" type="number" placeholder="Amount" required><button>Add</button></form><ul id="list"></ul></main><script>let total=0;f.onsubmit=e=>{e.preventDefault();let a=Number(amount.value);total+=a;document.querySelector('#total').textContent=total;let x=document.createElement('li');x.textContent=name.value+' - ₹'+a;list.append(x);f.reset()}</script></body></html>
