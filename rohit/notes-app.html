<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohit - Notes</title><style>body{font:18px Arial;background:#f3e8ff;padding:30px}.box{max-width:700px;margin:auto;background:white;padding:25px;border:3px solid #7e22ce;border-radius:12px}input,textarea,button{padding:10px;margin:5px}textarea{width:90%;height:100px}article{border:1px solid #c084fc;padding:10px;margin:10px 0}</style></head><body><main class="box"><h1>Rohit's Notes</h1><form id="f"><input id="title" placeholder="Title" required><br><textarea id="text" placeholder="Write note" required></textarea><br><button>Save</button></form><section id="notes"></section></main><script>f.onsubmit=e=>{e.preventDefault();let a=document.createElement('article');a.innerHTML='<h3></h3><p></p><button>Delete</button>';a.querySelector('h3').textContent=title.value;a.querySelector('p').textContent=text.value;a.querySelector('button').onclick=()=>a.remove();notes.prepend(a);f.reset()}</script></body></html>
