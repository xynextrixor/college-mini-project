<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon University - Signup</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">HORIZON UNIVERSITY</div>
        <h1>ADMISSIONS DESK</h1>
        <form action="login.html" method="get">
            <input type="text" name="fullname" placeholder="FULL APPLICANT NAME" required>
            <input type="text" name="rollnumber" placeholder="ADMISSION / ROLL NO" required>
            <input type="password" name="password" placeholder="CREATE ACCESS KEY" required>
            <button type="submit">SUBMIT APPLICATION</button>
        </form>
        <a href="login.html">RETURN TO LOGIN PORTAL</a>
    </div>
    <div class="owner-badge">OWNER: ANMOL</div>
</body>
</html>
