<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmol - To-Do List</title><style>body{font:18px Arial;background:#e0f2fe;padding:30px}.box{max-width:500px;margin:auto;background:white;padding:25px;border:3px solid #0369a1;border-radius:12px}input,button{padding:10px;margin:4px}li{margin:10px}</style></head><body><main class="box"><h1>Anmol's To-Do List</h1><form id="f"><input id="t" placeholder="New task" required><button>Add</button></form><ul id="l"></ul></main><script>f.onsubmit=e=>{e.preventDefault();let x=document.createElement('li');x.innerHTML='<input type=checkbox> '+t.value+' <button>Remove</button>';x.querySelector('button').onclick=()=>x.remove();l.append(x);f.reset()}</script></body></html>
