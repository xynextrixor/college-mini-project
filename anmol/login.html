<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon University - Login</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">HORIZON UNIVERSITY</div>
        <h1>STUDENT PORTAL</h1>
        <form action="welcome.html" method="get">
            <input type="text" name="username" placeholder="UNIVERSITY ID" required autocomplete="username">
            <input type="password" name="password" placeholder="STUDENT PASSWORD" required autocomplete="current-password">
            <button type="submit">ENTER PORTAL</button>
        </form>
        <a href="signup.html">ENROLL NEW STUDENT</a>
    </div>
    <div class="owner-badge">OWNER: ANMOL</div>
</body>
</html>
