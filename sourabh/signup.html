<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Institute - Signup</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">MATRIX INSTITUTE</div>
        <h1>CADET ENROLLMENT</h1>
        <form action="login.html" method="get">
            <input type="text" name="fullname" placeholder="OFFICIAL NAME" required>
            <input type="text" name="cadetid" placeholder="CADET ROLL NUMBER" required>
            <input type="password" name="password" placeholder="CREATE SECURITY KEY" required>
            <button type="submit">SUBMIT ENROLLMENT</button>
        </form>
        <a href="login.html">BACK TO PORTAL ACCESS</a>
    </div>
    <div class="owner-badge">OWNER: SOURABH</div>
</body>
</html>
