<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Institute - Login</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">MATRIX INSTITUTE</div>
        <h1>PORTAL ACCESS</h1>
        <form action="welcome.html" method="get">
            <input type="text" name="username" placeholder="USERNAME / CADET ID" required autocomplete="username">
            <input type="password" name="password" placeholder="SECURITY KEY" required autocomplete="current-password">
            <button type="submit">LOGIN</button>
        </form>
        <a href="signup.html">CREATE CADET ACCOUNT</a>
    </div>
    <div class="owner-badge">OWNER: SOURABH</div>
</body>
</html>
