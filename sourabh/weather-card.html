<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sourabh - Weather</title><style>body{font:18px Arial;background:#cffafe;padding:30px;text-align:center}.box{max-width:500px;margin:auto;background:white;padding:30px;border:3px solid #0e7490;border-radius:15px}input,button{padding:10px}#temp{font-size:50px;color:#0e7490}</style></head><body><main class="box"><h1>Sourabh's Weather Card</h1><form id="f"><input id="city" placeholder="City" required><button>Check</button></form><h2 id="place">Your City</h2><div id="temp">25°C</div><p>Sunny and pleasant</p></main><script>f.onsubmit=e=>{e.preventDefault();place.textContent=city.value;temp.textContent=Math.floor(18+Math.random()*15)+'°C'}</script></body></html>
