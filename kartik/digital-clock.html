<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartik - Clock</title><style>body{font:20px Arial;background:#dcfce7;padding:30px;text-align:center}.box{max-width:600px;margin:auto;background:white;padding:35px;border:3px solid #15803d;border-radius:15px}.time{font-size:55px;color:#166534}</style></head><body><main class="box"><h1>Kartik's Digital Clock</h1><div class="time" id="clock"></div><p id="date"></p></main><script>function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString();date.textContent=d.toDateString()}tick();setInterval(tick,1000)</script></body></html>
