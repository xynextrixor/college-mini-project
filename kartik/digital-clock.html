<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartik - Time & Location</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3u2V5f4m8kY2T9Y8p4H6Hc8fB4P7E="
    crossorigin=""
  >
  <style>
    :root {
      --green: #15803d;
      --dark-green: #166534;
      --light-green: #dcfce7;
      --border: #bbf7d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      color: #17251b;
      background: var(--light-green);
      font: 16px Arial, sans-serif;
    }

    .layout {
      width: min(100%, 980px);
      margin: auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    .panel,
    .map-panel {
      padding: 24px;
      background: #ffffff;
      border: 3px solid var(--green);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(22, 101, 52, 0.12);
    }

    h1,
    h2 {
      margin-top: 0;
      color: var(--dark-green);
    }

    h1 {
      font-size: 1.8rem;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 1.25rem;
    }

    .time {
      margin: 28px 0 8px;
      color: var(--dark-green);
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .date,
    .hint,
    .location {
      color: #41634b;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 11px 16px;
      color: #ffffff;
      background: var(--green);
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--dark-green);
    }

    #map {
      height: 480px;
      border: 2px solid var(--border);
      border-radius: 10px;
    }

    .location {
      min-height: 24px;
      margin: 12px 0 0;
      font-size: 0.95rem;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }

      #map {
        height: 380px;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <h1>Kartik's Time & Location</h1>
      <p class="hint">Search for a place or drag the marker to choose a location.</p>
      <div class="time" id="clock" aria-live="polite"></div>
      <p class="date" id="date"></p>
      <p class="location" id="location">Selected location: none</p>
    </section>

    <section class="map-panel">
      <h2>Find a location</h2>
      <div class="search">
        <input id="search-input" type="search" placeholder="Search city or address" aria-label="Search city or address">
        <button id="search-button" type="button">Search</button>
      </div>
      <div id="map" aria-label="Interactive location map"></div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const clockElement = document.getElementById("clock");
    const dateElement = document.getElementById("date");
    const locationElement = document.getElementById("location");
    const searchInput = document.getElementById("search-input");
    const searchButton = document.getElementById("search-button");

    const map = L.map("map").setView([20.5937, 78.9629], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const marker = L.marker([20.5937, 78.9629], { draggable: true }).addTo(map);

    function updateClock() {
      const now = new Date();
      clockElement.textContent = now.toLocaleTimeString();
      dateElement.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function updateLocationLabel(lat, lon, label) {
      locationElement.textContent = label
        ? `Selected location: ${label} (${lat.toFixed(5)}, ${lon.toFixed(5)})`
        : `Selected coordinates: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    }

    async function reverseGeocode(lat, lon) {
      updateLocationLabel(lat, lon);

      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`,
          { headers: { Accept: "application/json" } }
        );
        if (!response.ok) {
          throw new Error("Reverse geocoding failed");
        }
        const result = await response.json();
        updateLocationLabel(lat, lon, result.display_name);
      } catch (error) {
        updateLocationLabel(lat, lon);
      }
    }

    function selectLocation(lat, lon) {
      marker.setLatLng([lat, lon]);
      map.setView([lat, lon], Math.max(map.getZoom(), 12));
      reverseGeocode(lat, lon);
    }

    async function searchLocation() {
      const query = searchInput.value.trim();
      if (!query) {
        locationElement.textContent = "Enter a city or address to search.";
        return;
      }

      searchButton.disabled = true;
      searchButton.textContent = "Searching...";

      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`,
          { headers: { Accept: "application/json" } }
        );
        if (!response.ok) {
          throw new Error("Search failed");
        }
        const results = await response.json();
        if (!results.length) {
          locationElement.textContent = "Location not found. Try another search.";
          return;
        }

        selectLocation(Number(results[0].lat), Number(results[0].lon));
      } catch (error) {
        locationElement.textContent = "Search is unavailable. Try again shortly.";
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Search";
      }
    }

    marker.on("dragend", () => {
      const position = marker.getLatLng();
      reverseGeocode(position.lat, position.lng);
    });

    map.on("click", (event) => {
      selectLocation(event.latlng.lat, event.latlng.lng);
    });

    searchButton.addEventListener("click", searchLocation);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        searchLocation();
      }
    });

    updateClock();
    setInterval(updateClock, 1000);
    reverseGeocode(20.5937, 78.9629);
  </script>
</body>
</html>
