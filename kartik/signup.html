<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Global - Signup</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">APEX GLOBAL</div>
        <h1>APEX REGISTRATION</h1>
        <form action="index.html" method="get">
            <input type="text" name="fullname" placeholder="RESEARCHER FULL NAME" required>
            <input type="text" name="researcherid" placeholder="RESEARCHER ID NUMBER" required>
            <input type="password" name="password" placeholder="ASSIGN ACCESS KEY" required>
            <button type="submit">ACTIVATE PROFILE</button>
        </form>
        <a href="index.html">RETURN TO GATEWAY</a>
    </div>
    <div class="owner-badge">OWNER: KARTIK</div>
</body>
</html>
