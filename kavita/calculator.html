<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavita - Nova Calculator</title>
  <style>
    :root {
      --ink: #1d2330;
      --muted: #737b8c;
      --surface: #ffffff;
      --background: #f3f5fb;
      --purple: #6d5dfc;
      --purple-dark: #5545df;
      --soft-purple: #eeecff;
      --line: #e4e7ef;
      --danger: #e05262;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: radial-gradient(circle at top left, #e8e5ff, var(--background) 48%);
      font: 16px Arial, sans-serif;
    }

    .app {
      width: min(100%, 900px);
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 250px;
      gap: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(67, 55, 144, 0.14);
      backdrop-filter: blur(12px);
    }

    .calculator,
    .history {
      padding: 24px;
      background: var(--surface);
      border-radius: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 1.65rem;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge {
      padding: 8px 11px;
      color: var(--purple-dark);
      background: var(--soft-purple);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .display {
      min-height: 116px;
      margin-bottom: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      background: #222738;
      border-radius: 14px;
      color: #ffffff;
      text-align: right;
    }

    .expression {
      min-height: 22px;
      width: 100%;
      overflow: hidden;
      color: #aab1c5;
      font-size: 0.95rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      width: 100%;
      overflow: hidden;
      font-size: 2.4rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      color: var(--ink);
      background: #f4f5f9;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;
    }

    button:hover {
      background: #e9ebf2;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .operator {
      color: var(--purple-dark);
      background: var(--soft-purple);
    }

    .equals {
      color: #ffffff;
      background: var(--purple);
    }

    .equals:hover {
      background: var(--purple-dark);
    }

    .clear {
      color: var(--danger);
    }

    .history {
      background: #fafaff;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    h2 {
      margin-bottom: 0;
      font-size: 1.1rem;
    }

    .clear-history {
      min-height: auto;
      padding: 5px 0;
      color: var(--purple-dark);
      background: transparent;
      font-size: 0.8rem;
    }

    .clear-history:hover {
      background: transparent;
      transform: none;
      text-decoration: underline;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-list li,
    .empty-history {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .history-list strong {
      display: block;
      margin-top: 4px;
      color: var(--ink);
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      .app {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .history {
        order: 2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="calculator">
      <div class="brand">
        <div>
          <h1>Kavita's Calculator</h1>
          <p class="subtitle">Quick calculations, beautifully organized.</p>
        </div>
        <span class="badge">NOVA</span>
      </div>

      <div class="display" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys">
        <button class="clear" data-action="clear">AC</button>
        <button data-action="backspace">⌫</button>
        <button class="operator" data-value="%">%</button>
        <button class="operator" data-value="/">÷</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="calculate">=</button>
      </div>
    </section>

    <aside class="history">
      <div class="history-header">
        <h2>Recent calculations</h2>
        <button class="clear-history" id="clear-history">Clear</button>
      </div>
      <ul class="history-list" id="history-list">
        <li class="empty-history">Your calculations will appear here.</li>
      </ul>
    </aside>
  </main>

  <script>
    const expressionElement = document.getElementById("expression");
    const resultElement = document.getElementById("result");
    const historyList = document.getElementById("history-list");
    const buttons = document.querySelectorAll("[data-value], [data-action]");

    let expression = "";
    let justCalculated = false;
    const history = [];

    function render() {
      expressionElement.textContent = expression.replace(/\*/g, "×").replace(/\//g, "÷");
      resultElement.textContent = expression || "0";
    }

    function addToExpression(value) {
      if (justCalculated && /[0-9.]/.test(value)) {
        expression = "";
      }
      justCalculated = false;

      if (/[+\-*/%]/.test(value) && /[+\-*/%]$/.test(expression)) {
        expression = expression.slice(0, -1);
      }
      expression += value;
      render();
    }

    function calculate() {
      if (!expression || !/[0-9]$/.test(expression)) {
        return;
      }

      try {
        const sanitized = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
        if (!/^[0-9+\-*/().\s]+$/.test(sanitized)) {
          throw new Error("Invalid expression");
        }
        const answer = Function(`"use strict"; return (${sanitized})`)();
        if (!Number.isFinite(answer)) {
          throw new Error("Invalid result");
        }
        const formatted = String(Number(answer.toFixed(10)));
        addHistory(expression, formatted);
        expressionElement.textContent = `${expression.replace(/\*/g, "×").replace(/\//g, "÷")} =`;
        resultElement.textContent = formatted;
        expression = formatted;
        justCalculated = true;
      } catch (error) {
        expressionElement.textContent = "Unable to calculate";
        resultElement.textContent = "Error";
        expression = "";
      }
    }

    function clearCalculator() {
      expression = "";
      justCalculated = false;
      render();
    }

    function addHistory(calculation, answer) {
      history.unshift({ calculation, answer });
      if (history.length > 6) {
        history.pop();
      }
      historyList.innerHTML = history.map((item) =>
        `<li>${item.calculation.replace(/\*/g, "×").replace(/\//g, "÷")}<strong>= ${item.answer}</strong></li>`
      ).join("");
    }

    function handleAction(action) {
      if (action === "clear") {
        clearCalculator();
      } else if (action === "backspace") {
        expression = expression.slice(0, -1);
        render();
      } else if (action === "calculate") {
        calculate();
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.value) {
          addToExpression(button.dataset.value);
        } else {
          handleAction(button.dataset.action);
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.]$/.test(event.key) || /^[+\-*/%]$/.test(event.key)) {
        addToExpression(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Backspace") {
        handleAction("backspace");
      } else if (event.key === "Escape") {
        clearCalculator();
      }
    });

    document.getElementById("clear-history").addEventListener("click", () => {
      history.length = 0;
      historyList.innerHTML = '<li class="empty-history">Your calculations will appear here.</li>';
    });
  </script>
</body>
</html>
