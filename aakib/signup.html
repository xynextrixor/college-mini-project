<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Polytechnic - Signup</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="logo">NEXUS POLYTECHNIC</div>
        <h1>CADET REGISTRATION</h1>
        <form action="index.html" method="get">
            <input type="text" name="fullname" placeholder="FULL CADET NAME" required>
            <input type="text" name="cadetid" placeholder="CADET ROLL NUMBER" required>
            <input type="password" name="password" placeholder="ASSIGN PASSPHRASE" required>
            <button type="submit">SUBMIT REGISTRATION</button>
        </form>
        <a href="index.html">RETURN TO NEXUS CENTRAL</a>
    </div>
    <div class="owner-badge">OWNER: AAKIB</div>
</body>
</html>
