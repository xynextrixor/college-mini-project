<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aakib - Quiz</title><style>body{font:18px Arial;background:#fce7f3;padding:30px}.box{max-width:520px;margin:auto;background:white;padding:25px;border:3px solid #be185d;border-radius:12px}button{display:block;margin:12px 0;padding:12px;background:#db2777;color:white;border:0;border-radius:5px}</style></head><body><main class="box"><h1>Aakib's Quiz</h1><div id="q"></div></main><script>let n=0,score=0,data=[['Capital of India?',['Delhi','Mumbai'],0],['2 + 2 = ?',['3','4'],1]];function show(){if(n==data.length){q.innerHTML='<h2>Score: '+score+'/'+data.length+'</h2>';return}q.innerHTML='<h2>'+data[n][0]+'</h2>'+data[n][1].map((x,i)=>'<button onclick="ans('+i+')">'+x+'</button>').join('')}function ans(i){if(i==data[n][2])score++;n++;show()}show()</script></body></html>
